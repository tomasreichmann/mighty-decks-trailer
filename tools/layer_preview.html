<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fangs in the Sun · zkouška vrstev</title>
<style>
*{box-sizing:border-box}body{margin:auto;max-width:1320px;padding:1rem clamp(1rem,3vw,3rem) 3rem;color:#19212a;background:#f6f3eb;font:1rem/1.45 "Segoe UI",sans-serif}
h1{font-size:clamp(1.7rem,4vw,3rem);line-height:1.05;margin:1.2rem 0 .5rem}p{max-width:76ch}fieldset{border:0;padding:0;margin:0}legend{font-weight:650;margin-bottom:.4rem}select,button{font:inherit;padding:.3rem .6rem}
.bar,.switches{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.2rem}.bar{margin:1rem 0}.switches label{white-space:nowrap}input{accent-color:#805028}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background-color:#2b2e33;background-image:repeating-conic-gradient(#414448 0% 25%,transparent 0% 50%);background-size:20px 20px;margin:.7rem 0}
.stage img{width:100%;height:100%;position:absolute;inset:0}.stage img[hidden]{display:none}.note{margin:.6rem 0 1.4rem}output{font-variant-numeric:tabular-nums}.muted{color:#534d44}a{color:#743f1a}:focus-visible{outline:3px solid #aa631e;outline-offset:2px}
</style>
<main>
<a href="../../handoff/START.md">← Předání do animatiku</a>
<h1>Zkouška vrstev</h1>
<p>Vyber kresbu a porovnej složený obraz s originálem. Posuvník ukáže odkrytí pod vrstvami v doporučeném směru. Vypnutím jednotlivých vrstev najdeš případný druhý obrys nebo nedokreslený podklad.</p>
<div class="bar"><label>Záběr <select id="shot"></select></label><label><input type="checkbox" id="original"> Ukázat původní kresbu</label><label id="cardsLabel" hidden>Karty na stole <select id="cards"><option value="">Bez sazby</option><option value="cs" selected>CS</option><option value="en">EN</option></select></label></div>
<div class="stage" id="stage" role="img" aria-label="Náhled vrstev"></div>
<div class="bar"><label>Posun vrstev <input type="range" id="travel" min="0" max="100" step="1" value="0"></label><output for="travel" id="amount">0 %</output><button type="button" id="play">Přehrát posun</button><button type="button" id="reset">Obnovit výchozí stav</button></div>
<fieldset><legend>Vrstvy · od zadní po přední</legend><div id="layers" class="switches"></div></fieldset>
<p id="notes" class="note muted"></p>
</main>
<script type="application/json" id="data">__MANIFEST__</script>
<script>
const data=JSON.parse(document.querySelector('#data').textContent), el=id=>document.getElementById(id);
const sel=el('shot'), travel=el('travel'), original=el('original'), stage=el('stage'), switches=el('layers');
let shot, items=[], faces=[], source, raf=0;
function stop(){cancelAnimationFrame(raf);raf=0;el('play').textContent=shot?.id==='over-shoulder'?'Přehrát volbu':'Přehrát posun'}
function pic(url){const im=new Image();im.src=url;im.alt='';stage.append(im);return im}
function redraw(){
  const t=Number(travel.value)/100, ref=original.checked;
  el('amount').textContent=travel.value+' %'; source.hidden=!ref;
  for(const {im,check,l} of items){
    im.hidden=ref||!check.checked;check.disabled=ref;
    im.style.transform='translate('+((l.dx||0)*t*100/data.width)+'%,'+((l.dy||0)*t*100/data.height)+'%)';
  }
  for(const im of faces){im.hidden=ref||!items[0]?.check.checked;im.style.transform=items[0]?.im.style.transform||''}
  el('cards').disabled=ref;
  travel.disabled=ref||!items.some(({l})=>l.dx||l.dy);el('play').disabled=travel.disabled;
}
function show(){
  shot=data.shots[sel.selectedIndex];stop();stage.replaceChildren();switches.replaceChildren();items=[];faces=[];
  const assets=shot.id==='table'?['table-faces']:shot.id==='over-shoulder'?['overhead-U2','overhead-C2','overhead-S1']:[];
  el('cardsLabel').hidden=assets.length===0;
  for(const l of shot.layers){
    const im=pic(l.file), lab=document.createElement('label'),check=document.createElement('input');
    check.type='checkbox';check.checked=true;check.onchange=redraw;
    const offset=l.dx||l.dy?' · '+(l.dx||0)+', '+(l.dy||0)+' px':' · pevně';
    lab.append(check,' '+l.name+offset);switches.append(lab);items.push({im,check,l});
    if(items.length===1 && el('cards').value){for(const f of assets)faces.push(pic('../overlays/'+el('cards').value+'/'+f+'.png'))}
  }
  source=pic(shot.source);original.checked=items.length===0;original.disabled=items.length===0;travel.value=shot.id==='over-shoulder'?100:0;
  stage.setAttribute('aria-label','Náhled: '+shot.id);el('notes').textContent=shot.note||shot.status||'';redraw();
}
for(const s of data.shots){sel.add(new Option(s.id+' · '+(s.status||''),s.id))}
sel.onchange=()=>{location.hash=sel.value;show()};el('reset').onclick=show;el('cards').onchange=show;travel.oninput=()=>{stop();redraw()};original.onchange=()=>{stop();redraw()};
el('play').onclick=()=>{
  if(raf){stop();return}
  el('play').textContent='Pozastavit';const start=performance.now();
  function frame(now){
    const choice=shot.id==='over-shoulder',t=Math.min(1,(now-start)/(choice?2000:3000));
    const phase=Math.min(1,Math.max(0,(t*60-12)/18));
    travel.value=choice?Math.round(50*(1+Math.cos(Math.PI*phase))):Math.round(50*(1-Math.cos(2*Math.PI*t)));redraw();
    if(t<1)raf=requestAnimationFrame(frame);else stop();
  }
  raf=requestAnimationFrame(frame);
};
function fromHash(){const id=location.hash.slice(1);if(data.shots.some(s=>s.id===id))sel.value=id;if(sel.options.length)show()}
window.addEventListener('hashchange',fromHash);fromHash();
</script>
</html>
