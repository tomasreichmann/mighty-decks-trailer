<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porovnání pilotu · Mighty Decks</title>
<link rel="icon" href="data:,">
<style>
  :root {color-scheme:dark; font-family:'Segoe UI',system-ui,sans-serif; background:#11191e; color:#f6f0e7}
  * {box-sizing:border-box} body {margin:0}
  main {width:min(100% - 40px,960px); margin:clamp(18px,4vh,48px) auto 40px}
  header {display:flex; align-items:baseline; flex-wrap:wrap; gap:8px 22px; margin-bottom:18px}
  h1 {font:700 clamp(1.65rem,4vw,2.3rem)/1.1 Georgia,serif; margin:0} header span {color:#c4c5be}
  fieldset {margin:0 0 16px; padding:0; border:0} legend {padding:0 0 8px; color:#d0c7b6; font-weight:600}
  #choices {display:flex; flex-wrap:wrap; gap:6px}
  .option {position:relative; cursor:pointer} .option input {position:absolute; opacity:0; inset:0; width:100%; height:100%; margin:0; cursor:pointer}
  .option span,button {display:inline-flex; align-items:center; min-height:44px; border:1px solid #617077; border-radius:5px; background:#1e2a31; color:#f8f2e8; padding:7px 13px; font:inherit}
  .option input:checked + span {background:#efdbb9; color:#142027; border-color:#efdbb9; font-weight:650}
  .option:hover span,button:hover {border-color:#efdbb9}
  .option input:focus-visible + span,button:focus-visible,video:focus-visible {outline:3px solid #ffc869; outline-offset:3px}
  video {display:block; width:100%; max-height:65vh; aspect-ratio:16/9; background:#06090b; object-fit:contain}
  footer {display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:12px}
  button {cursor:pointer} button:disabled {opacity:.6; cursor:default}
  #preference {margin-inline-start:auto; color:#e4d3b5} .error {color:#ffc3a9}
  #status:empty {display:none}
  #related {display:flex; flex-wrap:wrap; gap:8px 20px; margin:14px 0}
  #related:empty {display:none} #related a {color:#efdbb9; padding:7px 0}
  @media(max-width:580px) {main {width:calc(100% - 24px)} #preference {width:100%; margin:.3em 0} video {max-height:none} header {display:grid}}
</style>
<main>
  <header><h1>Porovnání pilotu</h1><span>Mighty Decks · Fangs in the Sun</span></header>
  <fieldset><legend>Obraz a zvuk</legend><div id="choices"></div></fieldset>
  <video id="player" controls playsinline preload="auto" tabindex="0" aria-label="Přehrávač pilotního záběru"></video>
  <footer>
    <button type="button" id="replay" disabled>Přehrát od začátku</button>
    <button type="button" id="choose" disabled>Vybrat tuto verzi</button>
    <span id="preference" role="status"></span>
  </footer>
  <p id="status" class="error" role="status">Načítám dostupné verze…</p>
  <nav id="related" aria-label="Další náhledy"></nav>
</main>
<script type="module">
const player = document.querySelector('#player');
const choices = document.querySelector('#choices');
const status = document.querySelector('#status');
const choose = document.querySelector('#choose');
const preference = document.querySelector('#preference');
const replay = document.querySelector('#replay');
const key = 'mighty-decks.fangs.pilot.';
const read = name => { try { return localStorage.getItem(key + name); } catch { return null; } };
function save(name, value) {
  try { localStorage.setItem(key + name, value); } catch { /* Playback also works in private sessions. */ }
}

let clips = [];
let active = null;
let selection = read('preference');
let pending = null;
let lastList = '';
let lastRelated = '';
player.muted = read('muted') === 'true';
player.addEventListener('volumechange', () => save('muted', player.muted));

function showPreference() {
  const preferred = clips.find(clip => clip.id === selection);
  preference.textContent = preferred ? 'Tvůj výběr · ' + preferred.label : '';
  choose.disabled = !active || active.id === selection;
}

function select(clip) {
  if (active?.id === clip.id && active.src === clip.src && !player.error) return;
  // Keep the source time and play state through rapid switches, including while metadata loads.
  pending = pending ?? { time: player.currentTime || 0, playing: !player.paused && !player.ended };
  player.pause();
  active = clip;
  player.src = clip.src;
  player.setAttribute('aria-label', clip.label);
  replay.disabled = true;
  save('last', clip.id);
  status.textContent = '';
  showPreference();
}

async function play() {
  try { await player.play(); }
  catch (error) {
    if (error.name !== 'AbortError') status.textContent = 'Přehrávání spustíš tlačítkem v obraze.';
  }
}
player.addEventListener('loadedmetadata', () => {
  if (!active || !pending || player.currentSrc !== active.src) return;
  const { time, playing } = pending;
  pending = null;
  player.currentTime = Math.min(time, player.duration);
  replay.disabled = false;
  if (playing && time < player.duration) void play();
});
player.addEventListener('error', () => {
  if (!player.error) return;
  status.textContent = 'Tento soubor se nepodařilo přehrát.';
});
replay.addEventListener('click', () => { player.currentTime = 0; void play(); });
choose.addEventListener('click', () => {
  if (active) {
    selection = active.id;
    save('preference', selection);
    showPreference();
  }
});

function renderChoices() {
  const focusedId = choices.contains(document.activeElement) ? document.activeElement.value : null;
  choices.replaceChildren();
  for (const clip of clips) {
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'clip';
    input.value = clip.id;
    input.checked = active?.id === clip.id;
    input.addEventListener('change', () => { if (input.checked) select(clip); });
    const label = document.createElement('label');
    label.className = 'option';
    const text = document.createElement('span');
    text.textContent = clip.label;
    label.append(input, text);
    choices.append(label);
    if (clip.id === focusedId) input.focus();
  }
}

// Publishing the manifest is the final step after making each MP4. Check its local file too.
async function available(clip) {
  if (!clip.src) return null;
  const url = new URL(clip.src, location.href);
  if (url.origin !== location.origin || !url.pathname.startsWith('/files/')) return null;
  try {
    const response = await fetch(url, {method:'HEAD', cache:'no-store'});
    if (response.ok && Number(response.headers.get('content-length')) > 0) return {...clip, src:url.href};
  } catch { /* The next refresh will pick up newly available files. */ }
  return null;
}
async function refresh() {
  try {
    const response = await fetch('variants.json', {cache:'no-store'});
    if (!response.ok) throw new Error('manifest');
    const {baseline, takes, edits = [], related = []} = await response.json();
    const relatedKey = JSON.stringify(related);
    if (lastRelated !== relatedKey) {
      const links = related.map(item => {
        const url = new URL(item.src, location.href);
        if (url.origin !== location.origin || !url.pathname.startsWith('/files/')) return null;
        const link = document.createElement('a');
        link.href = url.href;
        link.textContent = item.label;
        return link;
      }).filter(Boolean);
      document.querySelector('#related').replaceChildren(...links);
      lastRelated = relatedKey;
    }
    const candidates = [{id:'baseline', ...baseline}];
    for (const take of takes) {
      candidates.push(
        {id:take.id + '-native', label:take.label + ' · obraz a zvuk H3', src:take.native},
        {id:take.id + '-dub', label:take.label + ' · 2D se zvukem H3', src:take.dub},
      );
    }
    for (const edit of edits) {
      candidates.push({id:'edit-' + edit.id, label:edit.label, src:edit.src});
    }
    const next = (await Promise.all(candidates.map(available))).filter(Boolean);
    if (!next.length) throw new Error('empty');
    const serialized = JSON.stringify(next);
    if (serialized !== lastList) {
      clips = next;
      lastList = serialized;
      const target = clips.find(clip => clip.id === (active?.id ?? read('last'))) ?? clips[0];
      select(target);
      renderChoices();
      showPreference();
    }
  } catch {
    if (!active) status.textContent = 'Čekám na dostupný záběr.';
  } finally {
    setTimeout(refresh, 5000);
  }
}
void refresh();
</script>
</html>
